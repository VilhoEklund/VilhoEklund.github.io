name: Deploy server to Cloudflare

# Manual deployment of the Durable Object worker.
# Requires repository secrets:
#   CLOUDFLARE_API_TOKEN - a token with "Workers Scripts:Edit" permission
#   (optional) CLOUDFLARE_ACCOUNT_ID
#
# First-time setup steps are documented in the README ("Deploying the server").

on:
  workflow_dispatch:

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck server
        run: npm run typecheck -w apps/server

      - name: Publish with wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
