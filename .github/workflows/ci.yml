name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

      - name: Server deploy dry-run (validates wrangler config)
        run: npm run check:deploy -w apps/server

      - name: Build web
        run: npm run build:web
        env:
          # Placeholder; real deploys use the Pages workflow with a secret.
          VITE_GAME_SERVER_URL: wss://eternal-blocks-server.example.workers.dev/ws

      - name: Verify GitHub Pages base-path build
        run: node scripts/check-pages-build.mjs "/${{ github.event.repository.name }}/"
